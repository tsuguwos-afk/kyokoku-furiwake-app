<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>峡谷振り分け（真ん中・右・左）</title>
<style>
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --field: #f6f8fb;
  --ink: #1a2333;
  --muted: #5d6a7d;
  --line: #d6dce6;
  --accent: #2b4fd8;
  --accent-ink: #ffffff;
  --accent-soft: #e4e9fb;
  --bar-track: #e3e8f0;
  --ok: #1d7a4b;
  --warn: #a35509;
  --danger: #b3261e;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d;
    --surface: #1b212b;
    --field: #141920;
    --ink: #e6ebf3;
    --muted: #9aa6b8;
    --line: #2c3542;
    --accent: #7f9cff;
    --accent-ink: #0f1626;
    --accent-soft: #232c4a;
    --bar-track: #2a3240;
    --ok: #63c58f;
    --warn: #e6a35c;
    --danger: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d;
  --surface: #1b212b;
  --field: #141920;
  --ink: #e6ebf3;
  --muted: #9aa6b8;
  --line: #2c3542;
  --accent: #7f9cff;
  --accent-ink: #0f1626;
  --accent-soft: #232c4a;
  --bar-track: #2a3240;
  --ok: #63c58f;
  --warn: #e6a35c;
  --danger: #ff8a80;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
header.top { margin-bottom: 20px; }
h1 { font-size: 22px; line-height: 1.3; margin: 0 0 4px; font-weight: 700; letter-spacing: .01em; }
header.top p { margin: 0; color: var(--muted); font-size: 14px; }

.layout { display: grid; gap: 20px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 940px) {
  .layout { grid-template-columns: 360px minmax(0, 1fr); }
  .panel.input { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
}
.panel h2 { font-size: 15px; margin: 0 0 10px; font-weight: 700; }

label.lbl { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
textarea#members {
  width: 100%;
  min-height: 260px;
  resize: vertical;
  background: var(--field);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font: inherit;
  font-size: 14px;
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
}
textarea:focus-visible, button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.hint { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }

.opts { margin-top: 14px; display: grid; gap: 10px; }
.opt-row { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 14px; }
.opt-row .cap { font-weight: 700; font-size: 13px; margin-right: 2px; }
.opt-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
input[type="radio"], input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
button {
  font: inherit;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 9px 14px;
  cursor: pointer;
  min-height: 40px;
}
button:hover { background: var(--field); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
button.primary:hover { filter: brightness(1.07); background: var(--accent); }
button.quiet { border-color: transparent; color: var(--muted); background: transparent; }
button.quiet:hover { color: var(--ink); background: var(--field); }

.notice { margin-top: 12px; font-size: 13px; border-radius: 8px; padding: 8px 10px; background: var(--accent-soft); color: var(--ink); }
.notice.err { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
.notice ul { margin: 4px 0 0; padding-left: 18px; }

/* results */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0;
  margin-bottom: 16px;
  padding: 0;
  overflow: hidden;
}
.summary > div { padding: 12px 16px; border-right: 1px solid var(--line); }
.summary > div:last-child { border-right: 0; }
.summary dt { font-size: 12.5px; color: var(--muted); margin: 0; }
.summary dd { margin: 2px 0 0; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.summary dd small { font-size: 12.5px; font-weight: 400; color: var(--muted); margin-left: 4px; }
@media (max-width: 600px) {
  .summary > div { border-right: 0; border-bottom: 1px solid var(--line); }
  .summary > div:last-child { border-bottom: 0; }
}

.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.card header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h3 { margin: 0; font-size: 16px; font-weight: 700; }
.card .count { color: var(--muted); font-size: 13px; }
.card .sum { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.card .sum strong { font-size: 17px; }
.card .dev { font-size: 12.5px; color: var(--muted); }
.card .dev.ok { color: var(--ok); }
.card .dev.warn { color: var(--warn); }

.bar { position: relative; height: 8px; border-radius: 4px; background: var(--bar-track); margin: 8px 0 12px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }

ul.members { list-style: none; margin: 0 0 12px; padding: 0; flex: 1; user-select: text; }
ul.members li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 14px; }
ul.members li:first-child { border-top: 0; }
ul.members .nm { overflow-wrap: anywhere; }
ul.members .pw { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 1px; }
ul.members li.none { color: var(--muted); }
.card button.copy { width: 100%; }

.legend { color: var(--muted); font-size: 12.5px; margin: 10px 2px 0; display: flex; align-items: center; gap: 8px; }
.legend b { display: inline-block; width: 2px; height: 12px; background: var(--ink); }

.alltext { margin-top: 20px; }
.alltext .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.alltext h2 { margin: 0; }
textarea#all {
  width: 100%;
  min-height: 200px;
  resize: vertical;
  background: var(--field);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font: inherit;
  font-size: 14px;
  line-height: 1.55;
}
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .35s ease; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>峡谷振り分け（真ん中・右・左）</h1>
    <p>メンバー名と総力を貼り付けると、真ん中・右・左の合計総力がほぼ同じになるよう振り分けます。</p>
  </header>

  <div class="layout">
    <section class="panel input" aria-label="入力">
      <label class="lbl" for="members">メンバー名と総力（1行に1人）</label>
      <textarea id="members" spellcheck="false" placeholder="山田 123456789&#10;佐藤 98,765,432&#10;鈴木 85.5M&#10;田中 1.2億"></textarea>
      <p class="hint">名前と総力は、スペース・タブ・カンマのどれで区切ってもOKです。Excel・Googleスプレッドシートは、名前と総力の列をコピーしてそのまま貼り付けられます（見出し行があっても、順位などの列が増えても読み取ります）。「M」「K」「万」「億」の単位にも対応しています。</p>

      <div class="opts">
        <div class="opt-row">
          <label><input type="checkbox" id="equalCount" checked> 人数もほぼ均等にする</label>
        </div>
        <div class="opt-row" role="radiogroup" aria-label="コピーの区切り">
          <span class="cap">コピーの区切り</span>
          <label><input type="radio" name="sep" value="nl" checked> 改行</label>
          <label><input type="radio" name="sep" value="comma"> 「、」</label>
          <label><input type="radio" name="sep" value="space"> スペース</label>
        </div>
        <div class="opt-row">
          <label><input type="checkbox" id="withPower"> コピーに総力も含める</label>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="primary" id="run">振り分ける</button>
        <button type="button" id="again" disabled>別パターン</button>
        <button type="button" class="quiet" id="sample">サンプル</button>
        <button type="button" class="quiet" id="clear">クリア</button>
      </div>
      <div id="notice" aria-live="polite"></div>
    </section>

    <section aria-label="結果">
      <div id="out">
        <div class="panel empty"><p>左の欄にメンバー名と総力を入力して、「振り分ける」を押してください。</p></div>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  'use strict';

  var LOCS = ['真ん中', '右', '左'];
  var G = LOCS.length;
  var STORE_KEY = 'sorryoku-balancer-input';

  var $ = function (s) { return document.querySelector(s); };
  var elMembers = $('#members');
  var elOut = $('#out');
  var elNotice = $('#notice');
  var btnAgain = $('#again');

  var state = { groups: null, members: null };

  function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }

  /* ---------- storage (per-viewer convenience only) ---------- */
  function saveInput() {
    try { localStorage.setItem(STORE_KEY, elMembers.value); } catch (e) {}
  }
  function loadInput() {
    try { var v = localStorage.getItem(STORE_KEY); if (v) elMembers.value = v; } catch (e) {}
  }

  /* ---------- parsing ---------- */
  var UNITS = { '億': 1e8, '万': 1e4, 'k': 1e3, 'm': 1e6, 'b': 1e9 };

  function parsePower(s) {
    s = s.replace(/,/g, '').trim();
    var m = s.match(/^(\d+(?:\.\d+)?|\.\d+)\s*(億|万|[KkMmBb])?$/);
    if (!m) return NaN;
    var v = parseFloat(m[1]);
    if (m[2]) v *= UNITS[m[2].toLowerCase()];
    return Math.round(v);
  }

  var LINE_RE = /^(.+?)[\s,、]+([\d,.]+\s*(?:億|万|[KkMmBb])?)$/;

  // One line -> {name, power} or null.
  // Tab-separated lines (pasted from a spreadsheet) may have extra columns:
  // the name is the first non-numeric cell, the power is the first numeric cell after it.
  function parseLine(line) {
    line = line.replace(/["“”]/g, '').trim();
    if (!line) return null;

    if (line.indexOf('\t') >= 0) {
      var cells = line.split('\t').map(function (c) { return c.trim(); })
        .filter(function (c) { return c !== ''; });
      var ni = -1, k;
      for (k = 0; k < cells.length; k++) {
        if (!isFinite(parsePower(cells[k]))) { ni = k; break; }
      }
      if (ni >= 0) {
        for (k = ni + 1; k < cells.length; k++) {
          var v = parsePower(cells[k]);
          if (isFinite(v)) return { name: cells[ni], power: v };
        }
      }
    }

    var m = line.match(LINE_RE);
    if (!m) return null;
    var p = parsePower(m[2]);
    if (!isFinite(p) || p < 0) return null;
    return { name: m[1].trim(), power: p };
  }

  function parseInput(text) {
    var members = [], errors = [], seenFirst = false;
    var lines = text.normalize('NFKC').split(/\r?\n/);
    lines.forEach(function (raw, idx) {
      if (!raw.trim()) return;
      var isFirst = !seenFirst;
      seenFirst = true;
      var r = parseLine(raw);
      if (!r) {
        // header row such as 「名前  総力」 (first line, no digits)
        if (isFirst && !/\d/.test(raw)) return;
        errors.push({ no: idx + 1, text: raw.trim() });
        return;
      }
      members.push(r);
    });
    return { members: members, errors: errors };
  }

  /* ---------- solver ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function buildInitial(members, equal, rng, noise) {
    var n = members.length;
    var order = members.map(function (m) {
      return { m: m, k: m.power * (1 + (rng() - 0.5) * noise) };
    }).sort(function (a, b) { return b.k - a.k; }).map(function (x) { return x.m; });

    var groups = [];
    for (var g = 0; g < G; g++) groups.push({ items: [], sum: 0 });
    var base = Math.floor(n / G), extra = n % G, extraUsed = 0;

    order.forEach(function (m) {
      var best = -1;
      for (var g = 0; g < G; g++) {
        var c = groups[g].items.length;
        if (equal && !(c < base || (c === base && extraUsed < extra))) continue;
        if (best < 0 || groups[g].sum < groups[best].sum) best = g;
      }
      if (equal && groups[best].items.length === base) extraUsed++;
      groups[best].items.push(m);
      groups[best].sum += m.power;
    });
    return groups;
  }

  function improve(groups, equal) {
    var changed = true, guard = 0;
    while (changed && guard++ < 500) {
      changed = false;
      for (var a = 0; a < G; a++) {
        for (var b = a + 1; b < G; b++) {
          var A = groups[a], B = groups[b];
          var sa = A.sum, sb = B.sum;
          var best = -1, op = 0, bi = -1, bj = -1;
          var i, j, v;
          for (i = 0; i < A.items.length; i++) {
            var pi = A.items[i].power;
            for (j = 0; j < B.items.length; j++) {
              var d = B.items[j].power - pi;
              v = 2 * d * (sa - sb + d);
              if (v < best) { best = v; op = 1; bi = i; bj = j; }
            }
            if (!equal) {
              v = 2 * pi * (pi - sa + sb);
              if (v < best) { best = v; op = 2; bi = i; }
            }
          }
          if (!equal) {
            for (j = 0; j < B.items.length; j++) {
              var pj = B.items[j].power;
              v = 2 * pj * (pj - sb + sa);
              if (v < best) { best = v; op = 3; bj = j; }
            }
          }
          if (op === 1) {
            var x = A.items[bi], y = B.items[bj];
            A.items[bi] = y; B.items[bj] = x;
            A.sum += y.power - x.power; B.sum += x.power - y.power;
          } else if (op === 2) {
            var m2 = A.items.splice(bi, 1)[0];
            B.items.push(m2); A.sum -= m2.power; B.sum += m2.power;
          } else if (op === 3) {
            var m3 = B.items.splice(bj, 1)[0];
            A.items.push(m3); B.sum -= m3.power; A.sum += m3.power;
          }
          if (op) changed = true;
        }
      }
    }
  }

  function score(groups) {
    var total = 0;
    groups.forEach(function (g) { total += g.sum; });
    var mean = total / G, s = 0;
    groups.forEach(function (g) { s += (g.sum - mean) * (g.sum - mean); });
    return s;
  }

  function solve(members, equal, seed) {
    var rng = mulberry32(seed);
    var n = members.length;
    var attempts = Math.max(6, Math.min(150, Math.floor(3e6 / Math.max(1, n * n))));
    var results = [];
    for (var t = 0; t < attempts; t++) {
      var noise = t === 0 ? 0 : 0.3 + rng() * 1.5;
      var g = buildInitial(members, equal, rng, noise);
      improve(g, equal);
      results.push({ groups: g, score: score(g) });
    }
    results.sort(function (a, b) { return a.score - b.score; });
    return { results: results, rng: rng };
  }

  function shuffleInPlace(arr, rng) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---------- run ---------- */
  function run(variant) {
    var parsed = parseInput(elMembers.value);
    saveInput();
    elNotice.replaceChildren();

    if (parsed.errors.length) {
      var box = document.createElement('div');
      box.className = 'notice err';
      box.appendChild(document.createTextNode('読み取れなかった行が ' + parsed.errors.length + ' 件あります（除外して計算しました）。「名前 総力」の形に直してください。'));
      var ul = document.createElement('ul');
      parsed.errors.slice(0, 5).forEach(function (e) {
        var li = document.createElement('li');
        li.textContent = e.no + '行目: ' + e.text;
        ul.appendChild(li);
      });
      box.appendChild(ul);
      elNotice.appendChild(box);
    }

    if (!parsed.members.length) {
      state.groups = null; state.members = null;
      btnAgain.disabled = true;
      elOut.replaceChildren();
      var emp = document.createElement('div');
      emp.className = 'panel empty';
      var p = document.createElement('p');
      p.textContent = '有効なメンバーがいません。「名前 総力」の形式で1行に1人ずつ入力してください。';
      emp.appendChild(p);
      elOut.appendChild(emp);
      return;
    }

    if (parsed.members.length < G) {
      var nb = document.createElement('div');
      nb.className = 'notice';
      nb.textContent = '人数が ' + G + ' 人未満のため、メンバーがいない場所があります。';
      elNotice.appendChild(nb);
    }

    var equal = $('#equalCount').checked;
    var seed = variant ? (Date.now() & 0x7fffffff) : 12345;
    var solved = solve(parsed.members, equal, seed);
    var pick = solved.results[0];
    if (variant) {
      var top = solved.results.slice(0, Math.min(5, solved.results.length));
      pick = top[Math.floor(solved.rng() * top.length)];
    }
    var groups = pick.groups.map(function (g) {
      g.items.sort(function (a, b) { return b.power - a.power; });
      return g;
    });
    if (variant) shuffleInPlace(groups, solved.rng);

    state.groups = groups;
    state.members = parsed.members;
    btnAgain.disabled = false;
    render();
  }

  /* ---------- copy text ---------- */
  function opts() {
    return {
      sep: (document.querySelector('input[name="sep"]:checked') || {}).value || 'nl',
      withPower: $('#withPower').checked
    };
  }
  function names(g, o) {
    var list = g.items.map(function (m) { return o.withPower ? m.name + '（' + fmt(m.power) + '）' : m.name; });
    var glue = o.sep === 'nl' ? '\n' : (o.sep === 'comma' ? '、' : ' ');
    return list.join(glue);
  }
  function allText() {
    if (!state.groups) return '';
    var o = opts();
    return state.groups.map(function (g, i) {
      return o.sep === 'nl'
        ? '【' + LOCS[i] + '】\n' + names(g, o)
        : LOCS[i] + '：' + names(g, o);
    }).join(o.sep === 'nl' ? '\n\n' : '\n');
  }

  function copyText(text) {
    var done = function (ok) { return ok; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallbackCopy(text); });
    }
    return Promise.resolve(done(fallbackCopy(text)));
  }
  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  function flash(btn, ok) {
    var orig = btn.getAttribute('data-label') || btn.textContent;
    btn.setAttribute('data-label', orig);
    btn.textContent = ok ? 'コピーしました' : 'コピーできませんでした。下の欄から選択してください';
    clearTimeout(btn._t);
    btn._t = setTimeout(function () { btn.textContent = orig; }, 1800);
  }

  /* ---------- render ---------- */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    elOut.replaceChildren();
    if (!state.groups) return;

    var groups = state.groups;
    var total = 0, max = 0, min = Infinity;
    groups.forEach(function (g) { total += g.sum; if (g.sum > max) max = g.sum; if (g.sum < min) min = g.sum; });
    var avg = total / G;
    var gap = max - min;
    var gapPct = avg > 0 ? (gap / avg * 100) : 0;

    // summary
    var sum = el('dl', 'panel summary');
    [
      ['メンバー', state.members.length + '人', ''],
      ['総力の合計', fmt(total), ''],
      ['1か所の平均', fmt(avg), ''],
      ['最大と最小の差', fmt(gap), '（' + gapPct.toFixed(2) + '%）']
    ].forEach(function (r) {
      var d = el('div');
      d.appendChild(el('dt', null, r[0]));
      var dd = el('dd', null, r[1]);
      if (r[2]) dd.appendChild(el('small', null, r[2]));
      d.appendChild(dd);
      sum.appendChild(d);
    });
    elOut.appendChild(sum);

    // cards
    var grid = el('div', 'grid');
    var scale = Math.max(max, 1);
    groups.forEach(function (g, i) {
      var card = el('article', 'card');
      var head = el('header');
      head.appendChild(el('h3', null, LOCS[i]));
      head.appendChild(el('span', 'count', g.items.length + '人'));
      card.appendChild(head);

      var dev = avg > 0 ? (g.sum - avg) / avg * 100 : 0;
      var s = el('div', 'sum');
      s.appendChild(el('strong', null, fmt(g.sum)));
      var devEl = el('span', 'dev ' + (Math.abs(dev) <= 1.5 ? 'ok' : 'warn'), '平均比 ' + (dev >= 0 ? '+' : '') + dev.toFixed(2) + '%');
      s.appendChild(devEl);
      card.appendChild(s);

      var bar = el('div', 'bar');
      var fill = el('i'); fill.style.width = (g.sum / scale * 100).toFixed(2) + '%';
      var mark = el('b'); mark.style.left = (avg / scale * 100).toFixed(2) + '%';
      bar.appendChild(fill); bar.appendChild(mark);
      card.appendChild(bar);

      var ul = el('ul', 'members');
      if (!g.items.length) {
        ul.appendChild(el('li', 'none', '（メンバーなし）'));
      } else {
        g.items.forEach(function (m) {
          var li = el('li');
          li.appendChild(el('span', 'nm', m.name));
          li.appendChild(el('span', 'pw', fmt(m.power)));
          ul.appendChild(li);
        });
      }
      card.appendChild(ul);

      var btn = el('button', 'copy', '名前をコピー');
      btn.type = 'button';
      btn.addEventListener('click', function () {
        var t = names(g, opts());
        copyText(t).then(function (ok) { flash(btn, ok); });
      });
      card.appendChild(btn);
      grid.appendChild(card);
    });
    elOut.appendChild(grid);

    var legend = el('div', 'legend');
    legend.appendChild(el('b'));
    legend.appendChild(el('span', null, '黒い線は1か所あたりの平均です。'));
    elOut.appendChild(legend);

    // all text
    var box = el('div', 'panel alltext');
    var h = el('div', 'head');
    h.appendChild(el('h2', null, '全体をまとめてコピー'));
    var allBtn = el('button', 'primary', '全部コピー');
    allBtn.type = 'button';
    h.appendChild(allBtn);
    box.appendChild(h);
    var ta = el('textarea');
    ta.id = 'all';
    ta.readOnly = true;
    ta.setAttribute('aria-label', '振り分け結果のテキスト');
    ta.value = allText();
    box.appendChild(ta);
    allBtn.addEventListener('click', function () {
      copyText(ta.value).then(function (ok) { flash(allBtn, ok); });
    });
    elOut.appendChild(box);
  }

  function refreshAllText() {
    var ta = document.getElementById('all');
    if (ta) ta.value = allText();
  }

  /* ---------- samples ---------- */
  function sample() {
    var rng = mulberry32(2024);
    var lines = [];
    for (var i = 1; i <= 42; i++) {
      var p = Math.round((32 + rng() * rng() * 90 + rng() * 25) * 1e6 / 1000) * 1000;
      lines.push('メンバー' + (i < 10 ? '0' + i : i) + ' ' + p.toLocaleString('en-US'));
    }
    return lines.join('\n');
  }

  /* ---------- events ---------- */
  $('#run').addEventListener('click', function () { run(false); });
  btnAgain.addEventListener('click', function () { run(true); });
  $('#sample').addEventListener('click', function () {
    elMembers.value = sample();
    saveInput();
    run(false);
  });
  $('#clear').addEventListener('click', function () {
    elMembers.value = '';
    saveInput();
    state.groups = null; state.members = null;
    btnAgain.disabled = true;
    elNotice.replaceChildren();
    elOut.replaceChildren();
    var emp = el('div', 'panel empty');
    emp.appendChild(el('p', null, '左の欄にメンバー名と総力を入力して、「振り分ける」を押してください。'));
    elOut.appendChild(emp);
    elMembers.focus();
  });
  elMembers.addEventListener('input', saveInput);
  $('#equalCount').addEventListener('change', function () { if (state.groups) run(false); });
  $('#withPower').addEventListener('change', refreshAllText);
  Array.prototype.forEach.call(document.querySelectorAll('input[name="sep"]'), function (r) {
    r.addEventListener('change', refreshAllText);
  });

  loadInput();
})();
</script>
</body>
</html>
